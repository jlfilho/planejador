services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planejador
      POSTGRES_PASSWORD: planejador
      POSTGRES_DB: planejador
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planejador -d planejador"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
