openapi: 3.0.3
info: { title: Planejador BNCC Plans API, version: 1.0.0 }
servers: [{ url: /api/v1 }]
paths:
  /plans/generations:
    post:
      summary: Solicita geração de rascunho por IA
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateGeneration' } } } }
      responses: { '201': { description: Rascunho criado após resposta válida, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }, '400': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/Unauthorized' }, '502': { $ref: '#/components/responses/GenerationFailed' }, '504': { $ref: '#/components/responses/GenerationFailed' } }
  /plans:
    get:
      summary: Lista planos visíveis ao usuário autenticado
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Planos autorizados, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Plan' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /plans/{planId}:
    get:
      summary: Obtém plano com referências e habilidades de origem
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlanId' }]
      responses: { '200': { description: Plano autorizado, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      summary: Salva Markdown e referências de rascunho autorizado
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlanId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePlan' } } } }
      responses: { '200': { description: Rascunho salvo, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/FinalizedConflict' } }
  /plans/{planId}/finalize:
    post:
      summary: Finaliza explicitamente um rascunho do proprietário
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlanId' }]
      responses: { '200': { description: Plano finalizado, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/FinalizedConflict' } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters: { PlanId: { name: planId, in: path, required: true, schema: { type: string, format: uuid } } }
  schemas:
    CreateGeneration: { type: object, required: [skillIds, instruction, durationMinutes, usesDigitalResources], properties: { skillIds: { type: array, minItems: 1, items: { type: string, format: uuid } }, instruction: { type: string, minLength: 1 }, durationMinutes: { type: integer, minimum: 1 }, usesDigitalResources: { type: boolean } } }
    Reference: { type: object, required: [title], properties: { title: { type: string, minLength: 1 }, url: { type: string, format: uri }, citation: { type: string } } }
    UpdatePlan: { type: object, required: [markdown, references], properties: { markdown: { type: string, minLength: 1 }, references: { type: array, items: { $ref: '#/components/schemas/Reference' } } } }
    PlanOwner: { type: object, required: [id, email], properties: { id: { type: string, format: uuid }, email: { type: string, format: email } } }
    Plan: { type: object, required: [id, ownerId, owner, status, markdown, aiAssisted, skills, references], properties: { id: { type: string, format: uuid }, ownerId: { type: string, format: uuid }, owner: { $ref: '#/components/schemas/PlanOwner' }, status: { type: string, enum: [RASCUNHO, FINALIZADO] }, markdown: { type: string }, aiAssisted: { type: boolean, enum: [true] }, skills: { type: array, minItems: 1, items: { type: object } }, references: { type: array, items: { $ref: '#/components/schemas/Reference' } } } }
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    ValidationError: { description: Entrada inválida, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Sessão inválida, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Recurso privado não autorizado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Recurso inexistente ou não visível, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    FinalizedConflict: { description: Plano finalizado não pode mudar, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    GenerationFailed: { description: Geração indisponível ou inválida; nenhum plano parcial foi criado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
