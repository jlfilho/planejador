openapi: 3.0.3
info:
  title: Planejador BNCC Authentication API
  version: 1.0.0
  description: Contrato da Feature 001; todas as rotas usam o prefixo /api/v1.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Users
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Cria conta PROFESSOR pelo cadastro público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada e sessão iniciada
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/RegistrationConflict'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Autentica uma conta ativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada; refresh fornecido somente em cookie seguro
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotaciona o refresh token da sessão atual
      responses:
        '200':
          description: Novo access token; refresh atualizado somente em cookie seguro
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoga somente a sessão atual
      responses:
        '204':
          description: Sessão atual invalidada ou ausente
  /auth/me:
    get:
      tags: [Authentication]
      summary: Retorna a identidade da sessão atual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identidade atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
  /users/{userId}/status:
    patch:
      tags: [Users]
      summary: Altera o estado ativo ou inativo de uma conta
      description: Requer uma conta autenticada com o papel ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Estado da conta atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UserResponse:
      type: object
      required: [id, email, role, active]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, PROFESSOR]
        active:
          type: boolean
    UpdateUserStatusRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: Access token de curta duração.
        user:
          $ref: '#/components/schemas/UserResponse'
    RefreshResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: Access token de curta duração.
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    ValidationError:
      description: Dados inválidos sem ecoar senha ou segredo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RegistrationConflict:
      description: Não foi possível concluir o cadastro com os dados informados
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationFailed:
      description: Credencial, conta ou sessão inválida; não enumera contas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: A conta autenticada não possui autorização para a operação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: A conta solicitada não foi encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Limite de tentativas excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
